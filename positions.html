<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Academic Positions | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="navbar"></nav>
<div class="page-header"><div class="container"><h1>Academic Positions</h1><p>My academic career and professional roles.</p></div></div>
<section class="section">
  <div class="container" style="max-width:720px">
    <div class="sidebar-block sb-positions" data-fade style="border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:32px">
      <div class="sidebar-block-header">🎓 Academic Positions</div>
      <div class="sidebar-block-body"><div class="timeline" id="positionsList"><div class="spinner"></div></div></div>
    </div>
    <div class="sidebar-block sb-experience" data-fade style="border-radius:12px;overflow:hidden;box-shadow:var(--shadow)">
      <div class="sidebar-block-header">💼 Professional Experience</div>
      <div class="sidebar-block-body"><div class="timeline" id="experienceList"><div class="spinner"></div></div></div>
    </div>
  </div>
</section>
<footer class="footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Abu Zafar.</p></div></footer>
<script type="module">
import { insertNav } from "./js/nav.js";
import { db } from "./js/firebase-config.js";
import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import "./js/shared.js";
insertNav();
function tHTML(items){
  if(!items.length) return `<p style="color:var(--clr-muted);font-size:0.9rem">No entries yet.</p>`;
  return items.map(i=>`<div class="timeline-item"><span class="timeline-year">${i.years||""}</span><strong>${i.title||""}</strong><span>${i.place||""}</span></div>`).join("");
}
const p=await getDocs(query(collection(db,"positions"),orderBy("order")));
document.getElementById("positionsList").innerHTML=tHTML(p.docs.map(d=>d.data()));
const e=await getDocs(query(collection(db,"experience"),orderBy("order")));
document.getElementById("experienceList").innerHTML=tHTML(e.docs.map(d=>d.data()));
</script>
</body></html>
