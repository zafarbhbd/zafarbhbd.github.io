<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="eyebrow">Attendance</p>
      <h1>Welcome to Abu Zafar's Attendance Portal</h1>
    </div>

    <div class="card" id="yearCard">
      <label>Select your year</label>
      <div class="pill-row" id="yearPills"></div>
    </div>

    <div class="card" id="subjectCard" style="display:none;">
      <label>Select your subject</label>
      <div class="pill-row" id="subjectPills"></div>
    </div>

    <div class="card" id="attCard" style="display:none;">
      <div id="loadingRow" class="msg info">Checking session status&hellip;</div>

      <div id="openArea" style="display:none;">
        <p class="eyebrow" id="sessionLabel"></p>
        <h2 style="margin-bottom:14px;">Session is open</h2>

        <div style="margin-bottom:14px;">
          <label>Registration number</label>
          <div class="skeleton" id="regSkeleton"></div>
          <select id="regSelect" style="display:none;" onchange="onRegChange()"></select>
        </div>
        <div style="margin-bottom:14px;">
          <label>Name</label>
          <div class="skeleton" id="nameSkeleton"></div>
          <select id="nameSelect" style="display:none;" onchange="onNameChange()"></select>
        </div>

        <div id="dupWarning" class="msg error" style="display:none;">You have already submitted attendance for this session.</div>

        <button class="btn-primary" id="submitBtn" disabled onclick="submitAttendance()">Submit attendance</button>
        <div id="submitMsg"></div>
      </div>

      <div id="closedArea" style="display:none;">
        <div class="msg info">No attendance session is open right now for this section.</div>

        <div style="margin-top:18px;">
          <label>Check my attendance so far</label>
          <div class="skeleton" id="ccSkeleton"></div>
          <select id="ccRegSelect" style="display:none;" onchange="onCcRegChange()"></select>
        </div>
        <button class="btn-secondary" id="ccBtn" disabled style="margin-top:10px; width:100%;" onclick="checkMyAttendance()">Check attendance</button>
        <div id="ccResult"></div>
      </div>
    </div>
  </div>

<script type="module">
import {
  db, collection, doc, getDoc, getDocs, setDoc, query, where, onSnapshot, serverTimestamp,
  YEARS, YEAR_LABELS, NM_SUBJECTS, YEAR_COLORS, YEAR_TINTS, needsSubject, sectionLabel, attendanceDocId
} from './firebase-config.js';

let currentYear = null;
let currentSubject = "";
let students = [];
let selectedStudent = null;
let currentSession = null; // {id, label, status} — kept live via onSnapshot
let sessionUnsub = null;

// ---- Read a direct link like ?year=Y2&subject=Islamic%20History ----
const urlParams = new URLSearchParams(location.search);
const linkedYear = urlParams.get('year');
const linkedSubject = urlParams.get('subject');

// ---- Year pills (colored) ----
const yearPills = document.getElementById('yearPills');
let yearButtons = {};
YEARS.forEach(yk => {
  const btn = document.createElement('button');
  btn.className = 'pill';
  btn.style.background = YEAR_TINTS[yk].bg;
  btn.style.borderColor = YEAR_TINTS[yk].border;
  btn.innerHTML = `<span class="pill-dot" style="background:${YEAR_COLORS[yk]}"></span>${YEAR_LABELS[yk]}`;
  btn.onclick = () => selectYear(yk, btn);
  yearPills.appendChild(btn);
  yearButtons[yk] = btn;
});

function selectYear(yearKey, btn) {
  currentYear = yearKey;
  [...yearPills.children].forEach((b, i) => {
    const yk = YEARS[i];
    b.classList.remove('active');
    b.style.background = YEAR_TINTS[yk].bg;
    b.style.borderColor = YEAR_TINTS[yk].border;
    b.style.color = '';
  });
  btn.classList.add('active');
  btn.style.background = YEAR_COLORS[yearKey];
  btn.style.borderColor = YEAR_COLORS[yearKey];
  btn.style.color = '#fff';

  document.getElementById('subjectCard').style.display = 'none';
  document.getElementById('attCard').style.display = 'none';

  if (needsSubject(yearKey)) {
    const subjectPills = document.getElementById('subjectPills');
    subjectPills.innerHTML = '';
    NM_SUBJECTS[yearKey].forEach(sub => {
      const b = document.createElement('button');
      b.className = 'pill';
      b.textContent = sub;
      b.onclick = () => selectSubject(sub, b);
      subjectPills.appendChild(b);
    });
    document.getElementById('subjectCard').style.display = 'block';

    if (linkedYear === yearKey && linkedSubject && NM_SUBJECTS[yearKey].includes(linkedSubject)) {
      const matchBtn = [...subjectPills.children].find(b => b.textContent === linkedSubject);
      if (matchBtn) selectSubject(linkedSubject, matchBtn);
    }
  } else {
    currentSubject = "";
    loadSection();
  }
}

function selectSubject(subject, btn) {
  currentSubject = subject;
  [...document.getElementById('subjectPills').children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadSection();
}

// Auto-select from a direct link, if valid.
if (linkedYear && YEARS.includes(linkedYear) && yearButtons[linkedYear]) {
  selectYear(linkedYear, yearButtons[linkedYear]);
}

// ---- Load roster + live session status for the chosen section ----
async function loadSection() {
  resetForm();
  document.getElementById('attCard').style.display = 'block';
  document.getElementById('loadingRow').style.display = 'block';
  document.getElementById('loadingRow').className = 'msg info';
  document.getElementById('loadingRow').textContent = 'Checking session status\u2026';
  document.getElementById('openArea').style.display = 'none';
  document.getElementById('closedArea').style.display = 'none';

  if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }

  try {
    const studQ = query(collection(db, 'students'), where('yearKey', '==', currentYear), where('subject', '==', currentSubject));
    const studSnap = await getDocs(studQ);
    students = studSnap.docs.map(d => d.data());

    document.getElementById('loadingRow').style.display = 'none';

    // Live-updating: the moment the teacher opens/closes a session, this page reflects it immediately.
    const sessQ = query(collection(db, 'sessions'),
      where('yearKey', '==', currentYear), where('subject', '==', currentSubject), where('status', '==', 'open'));
    sessionUnsub = onSnapshot(sessQ, sessSnap => {
      if (!sessSnap.empty) {
        const d = sessSnap.docs[0];
        currentSession = { id: d.id, ...d.data() };
        document.getElementById('sessionLabel').textContent = sectionLabel(currentYear, currentSubject) + ' \u00b7 ' + currentSession.label;
        populateDropdowns();
        document.getElementById('openArea').style.display = 'block';
        document.getElementById('closedArea').style.display = 'none';
      } else {
        currentSession = null;
        populateCcDropdown();
        document.getElementById('closedArea').style.display = 'block';
        document.getElementById('openArea').style.display = 'none';
      }
    }, err => {
      document.getElementById('loadingRow').style.display = 'block';
      document.getElementById('loadingRow').className = 'msg error';
      document.getElementById('loadingRow').textContent = 'Could not load this section: ' + err.message;
    });
  } catch (err) {
    document.getElementById('loadingRow').className = 'msg error';
    document.getElementById('loadingRow').textContent = 'Could not load this section: ' + err.message;
  }
}

function resetForm() {
  selectedStudent = null;
  document.getElementById('submitMsg').innerHTML = '';
  document.getElementById('ccResult').innerHTML = '';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('ccBtn').disabled = true;
  document.getElementById('dupWarning').style.display = 'none';
}

function populateDropdowns() {
  const regSel = document.getElementById('regSelect');
  const nameSel = document.getElementById('nameSelect');
  regSel.innerHTML = '<option value="" disabled selected>\u2014 Select your registration no \u2014</option>';
  nameSel.innerHTML = '<option value="" disabled selected>\u2014 Select your name \u2014</option>';
  students.forEach(s => {
    regSel.innerHTML += `<option value="${s.reg}">${s.reg}</option>`;
    nameSel.innerHTML += `<option value="${s.reg}">${s.name}</option>`;
  });
  document.getElementById('regSkeleton').style.display = 'none';
  document.getElementById('nameSkeleton').style.display = 'none';
  regSel.style.display = 'block';
  nameSel.style.display = 'block';
}

function populateCcDropdown() {
  const sel = document.getElementById('ccRegSelect');
  sel.innerHTML = '<option value="" disabled selected>\u2014 Select your registration no \u2014</option>';
  students.forEach(s => { sel.innerHTML += `<option value="${s.reg}">${s.reg} \u2014 ${s.name}</option>`; });
  document.getElementById('ccSkeleton').style.display = 'none';
  sel.style.display = 'block';
}

// ---- Immediate duplicate check the moment a student identifies themselves ----
async function checkAlreadySubmitted(student) {
  if (!currentSession) return;
  const dup = document.getElementById('dupWarning');
  const btn = document.getElementById('submitBtn');
  dup.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Checking\u2026';

  try {
    const id = attendanceDocId(currentSession.id, student.reg);
    const snap = await getDoc(doc(db, 'attendance', id));
    if (snap.exists()) {
      dup.style.display = 'flex';
      btn.disabled = true;
    } else {
      btn.disabled = false;
    }
  } catch (e) {
    btn.disabled = false; // fail open on the pre-check; the real enforcement is server-side anyway
  }
  btn.textContent = 'Submit attendance';
}

window.onRegChange = function () {
  const reg = document.getElementById('regSelect').value;
  const student = students.find(s => s.reg === reg);
  selectedStudent = student || null;
  document.getElementById('nameSelect').value = student ? student.reg : '';
  document.getElementById('submitMsg').innerHTML = '';
  if (student) checkAlreadySubmitted(student);
};
window.onNameChange = function () {
  const reg = document.getElementById('nameSelect').value;
  const student = students.find(s => s.reg === reg);
  selectedStudent = student || null;
  document.getElementById('regSelect').value = student ? student.reg : '';
  document.getElementById('submitMsg').innerHTML = '';
  if (student) checkAlreadySubmitted(student);
};
window.onCcRegChange = function () {
  document.getElementById('ccBtn').disabled = !document.getElementById('ccRegSelect').value;
};

// ---- Submit attendance ----
window.submitAttendance = async function () {
  if (!selectedStudent || !currentSession) return;
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('submitMsg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting\u2026';
  msg.innerHTML = '';

  const id = attendanceDocId(currentSession.id, selectedStudent.reg);
  try {
    await setDoc(doc(db, 'attendance', id), {
      yearKey: currentYear, subject: currentSubject,
      sessionId: currentSession.id, sessionLabel: currentSession.label,
      reg: selectedStudent.reg, name: selectedStudent.name,
      timestamp: serverTimestamp()
    });

    // Personal summary right after submitting.
    let summaryHtml = '';
    try {
      const attQ = query(collection(db, 'attendance'),
        where('yearKey', '==', currentYear), where('subject', '==', currentSubject), where('reg', '==', selectedStudent.reg));
      const attSnap = await getDocs(attQ);
      const sessQAll = query(collection(db, 'sessions'), where('yearKey', '==', currentYear), where('subject', '==', currentSubject));
      const sessSnapAll = await getDocs(sessQAll);
      const present = attSnap.size, total = sessSnapAll.size;
      const pct = total ? Math.round((present / total) * 1000) / 10 : 0;
      summaryHtml = `<br>Present in ${present} of ${total} session(s) so far (${pct}%).`;
    } catch (e) { /* summary is a nice-to-have; ignore failures here */ }

    msg.innerHTML = `<div class="msg ok">Attendance recorded for ${selectedStudent.reg} \u2014 ${selectedStudent.name}.${summaryHtml}</div>`;
    btn.textContent = 'Submitted';
  } catch (err) {
    if (err.code === 'permission-denied') {
      // Find out exactly why, so the message is accurate rather than a generic denial.
      try {
        const [sessSnap, attSnap] = await Promise.all([
          getDoc(doc(db, 'sessions', currentSession.id)),
          getDoc(doc(db, 'attendance', id))
        ]);
        if (attSnap.exists()) {
          msg.innerHTML = '<div class="msg error">You have already submitted attendance for this session.</div>';
        } else if (!sessSnap.exists() || sessSnap.data().status !== 'open') {
          msg.innerHTML = '<div class="msg error">This attendance session is now CLOSED. Please contact your teacher.</div>';
        } else {
          msg.innerHTML = '<div class="msg error">Submission was not accepted. Please try again.</div>';
        }
      } catch (e2) {
        msg.innerHTML = '<div class="msg error">Submission was not accepted. Please try again.</div>';
      }
      btn.textContent = 'Not submitted';
    } else {
      msg.innerHTML = `<div class="msg error">Could not submit \u2014 check your connection and try again.
        <button class="btn-secondary btn-sm" style="margin-top:8px;" onclick="submitAttendance()">Retry</button></div>`;
      btn.textContent = 'Submit attendance';
      btn.disabled = false;
      return;
    }
  }
};

// ---- Check my attendance (session closed) ----
window.checkMyAttendance = async function () {
  const reg = document.getElementById('ccRegSelect').value;
  const student = students.find(s => s.reg === reg);
  if (!student) return;

  const resultBox = document.getElementById('ccResult');
  resultBox.innerHTML = '<div class="msg info"><span class="spinner dark"></span> Loading\u2026</div>';

  try {
    const attQ = query(collection(db, 'attendance'),
      where('yearKey', '==', currentYear), where('subject', '==', currentSubject), where('reg', '==', reg));
    const attSnap = await getDocs(attQ);
    const present = attSnap.size;

    const sessQAll = query(collection(db, 'sessions'), where('yearKey', '==', currentYear), where('subject', '==', currentSubject));
    const sessSnapAll = await getDocs(sessQAll);
    const total = sessSnapAll.size;
    const pct = total ? Math.round((present / total) * 1000) / 10 : 0;

    const recent = attSnap.docs
      .map(d => d.data())
      .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))
      .slice(0, 5);

    let html = `<div class="msg ok"><strong>${student.name}</strong> (${student.reg})<br>
      Present: ${present} / ${total} sessions (${pct}%)</div>`;
    if (recent.length) {
      html += '<div style="margin-top:10px;">';
      recent.forEach(r => { html += `<div class="list-row"><span class="secondary">${r.sessionLabel}</span><span class="status-pill open">Present</span></div>`; });
      html += '</div>';
    }
    resultBox.innerHTML = html;
  } catch (err) {
    resultBox.innerHTML = `<div class="msg error">Could not load \u2014 check your connection and try again.
      <button class="btn-secondary btn-sm" style="margin-top:8px;" onclick="checkMyAttendance()">Retry</button></div>`;
  }
};
</script>
</body>
</html>
