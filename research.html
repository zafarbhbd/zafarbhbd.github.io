<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Research | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="navbar"></nav>
<div class="page-header"><div class="container"><h1>Research</h1><p>My areas of scholarly inquiry.</p></div></div>
<section class="section"><div class="container"><div id="researchGrid" class="research-grid"><div class="spinner"></div></div></div></section>
<footer class="footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Abu Zafar.</p></div></footer>
<script type="module">
import { insertNav } from "./js/nav.js";
import { db } from "./js/firebase-config.js";
import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import "./js/shared.js";
insertNav();
const snap=await getDocs(query(collection(db,"research"),orderBy("order")));
const items=snap.docs.map(d=>({id:d.id,...d.data()}));
const grid=document.getElementById("researchGrid");
if(!items.length){grid.innerHTML=`<div class="empty-state"><div class="empty-icon">🔬</div><p>Research areas coming soon.</p></div>`;}
else{grid.innerHTML=items.map(i=>`<div class="research-card" data-fade><div class="research-icon">${i.icon||"📌"}</div><h3>${i.title}</h3><p>${i.description}</p></div>`).join("");document.querySelectorAll("[data-fade]").forEach(el=>{const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("visible");o.unobserve(x.target)}}),{threshold:0.1});o.observe(el);});}
</script>
</body></html>
