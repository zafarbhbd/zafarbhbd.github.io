<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .research-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">Abu Zafar</a>
    <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="publications.html">Publications</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1>Research</h1>
    <p>My areas of scholarly inquiry and ongoing projects.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div id="researchGrid" class="research-grid">
      <div class="spinner"></div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <p>&copy; <span id="year"></span> Abu Zafar. All rights reserved.</p>
    <p>Hosted on Firebase &amp; GitHub Pages</p>
  </div>
</footer>

<script type="module">
  import { db }                             from "./js/firebase-config.js";
  import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import "./js/shared.js";

  const snap  = await getDocs(query(collection(db, "research"), orderBy("order")));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const grid  = document.getElementById("researchGrid");

  if (!items.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔬</div><p>Research areas coming soon.</p></div>`;
  } else {
    grid.innerHTML = items.map(i => `
      <div class="research-card" data-fade>
        <div class="research-icon">${i.icon || "📌"}</div>
        <h3>${i.title}</h3>
        <p>${i.description}</p>
      </div>`).join("");
    // Re-observe new elements
    document.querySelectorAll("[data-fade]").forEach(el => {
      const obs = new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); }
      }), { threshold: 0.12 });
      obs.observe(el);
    });
  }
</script>
</body>
</html>
