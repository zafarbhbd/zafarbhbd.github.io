<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Publications | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="navbar"></nav>
<div class="page-header"><div class="container"><h1>Publications</h1><p id="pubSubtitle">Peer-reviewed journal articles.</p></div></div>
<section class="section"><div class="container"><div id="pubList" class="pub-list"><div class="spinner"></div></div></div></section>
<footer class="footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Abu Zafar.</p></div></footer>
<script type="module">
import { insertNav } from "./js/nav.js";
import { db } from "./js/firebase-config.js";
import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import "./js/shared.js";
insertNav();
const snap=await getDocs(query(collection(db,"publications"),orderBy("year","desc")));
const pubs=snap.docs.map(d=>({id:d.id,...d.data()}));
document.getElementById("pubSubtitle").textContent=`${pubs.length} peer-reviewed publication${pubs.length!==1?"s":""}.`;
const list=document.getElementById("pubList");
if(!pubs.length){list.innerHTML=`<div class="empty-state"><div class="empty-icon">📄</div><p>Publications coming soon.</p></div>`;}
else{list.innerHTML=pubs.map(p=>`<div class="pub-card" data-fade><span class="pub-year">${p.year}</span><div class="pub-body"><h3 class="pub-title">${p.title}</h3><p class="pub-authors">${p.authors}</p><p class="pub-journal">${p.journal}${p.citations?` · <em>Cited ${p.citations} times</em>`:""}</p><div class="pub-links">${p.pdfUrl?`<a href="${p.pdfUrl}" target="_blank" class="pub-link">PDF ↗</a>`:""}${p.doiUrl?`<a href="${p.doiUrl}" target="_blank" class="pub-link">DOI ↗</a>`:""}</div></div></div>`).join("");document.querySelectorAll("[data-fade]").forEach(el=>{const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("visible");o.unobserve(x.target)}}),{threshold:0.1});o.observe(el);});}
</script>
</body></html>
