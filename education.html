<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Education | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="navbar"></nav>
<div class="page-header"><div class="container"><h1>Education</h1><p>Academic qualifications and training.</p></div></div>
<section class="section">
  <div class="container" style="max-width:720px">
    <div class="sidebar-block sb-education" data-fade style="border-radius:12px;overflow:hidden;box-shadow:var(--shadow)">
      <div class="sidebar-block-header">📚 Degrees &amp; Qualifications</div>
      <div class="sidebar-block-body"><div class="timeline" id="educationList"><div class="spinner"></div></div></div>
    </div>
  </div>
</section>
<footer class="footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Abu Zafar.</p></div></footer>
<script type="module">
import { insertNav } from "./js/nav.js";
import { db } from "./js/firebase-config.js";
import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import "./js/shared.js";
insertNav();
const e=await getDocs(query(collection(db,"education"),orderBy("order")));
const items=e.docs.map(d=>d.data());
document.getElementById("educationList").innerHTML=items.length?items.map(i=>`<div class="timeline-item"><span class="timeline-year">${i.years||""}</span><strong>${i.title||""}</strong><span>${i.place||""}</span></div>`).join(""):`<p style="color:var(--clr-muted)">No entries yet.</p>`;
</script>
</body></html>
