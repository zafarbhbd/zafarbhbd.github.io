<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>About | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="navbar"></nav>
<div class="page-header"><div class="container"><h1>About Me</h1><p>Political scientist, researcher, and educator.</p></div></div>
<section class="section">
  <div class="container">
    <div class="about-grid">
      <!-- LEFT: Bio -->
      <div data-fade>
        <div class="about-bio-card">
          <div id="bioText"><div class="spinner"></div></div>
          <div class="about-ambition">
            <h3>🎯 Future Ambitions</h3>
            <p id="ambitionText">Loading…</p>
          </div>
        </div>
      </div>
      <!-- RIGHT: Sidebar -->
      <div>
        <!-- Positions — Blue -->
        <div class="sidebar-block sb-positions" data-fade>
          <div class="sidebar-block-header">🎓 Academic Positions</div>
          <div class="sidebar-block-body">
            <div class="timeline" id="positionsList"><div class="spinner"></div></div>
          </div>
        </div>
        <!-- Experience — Green -->
        <div class="sidebar-block sb-experience" data-fade>
          <div class="sidebar-block-header">💼 Professional Experience</div>
          <div class="sidebar-block-body">
            <div class="timeline" id="experienceList"><div class="spinner"></div></div>
          </div>
        </div>
        <!-- Education — Purple -->
        <div class="sidebar-block sb-education" data-fade>
          <div class="sidebar-block-header">📚 Education</div>
          <div class="sidebar-block-body">
            <div class="timeline" id="educationList"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<footer class="footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Abu Zafar.</p><p>Hosted on Firebase &amp; GitHub Pages</p></div></footer>
<script type="module">
import { insertNav } from "./js/nav.js";
import { db } from "./js/firebase-config.js";
import { doc, getDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import "./js/shared.js";
insertNav("about");

function timelineHTML(items) {
  if(!items.length) return `<p style="color:var(--clr-muted);font-size:0.9rem">No entries yet.</p>`;
  return items.map(i=>`<div class="timeline-item"><span class="timeline-year">${i.years||""}</span><strong>${i.title||""}</strong><span>${i.place||""}</span></div>`).join("");
}

const sSnap = await getDoc(doc(db,"site","about"));
if(sSnap.exists()){
  const d=sSnap.data();
  document.getElementById("bioText").innerHTML=(d.bio||"Bio coming soon.").split("\n").filter(p=>p.trim()).map(p=>`<p style="margin-bottom:14px">${p}</p>`).join("");
  document.getElementById("ambitionText").textContent=d.ambition||"Coming soon.";
} else {
  document.getElementById("bioText").innerHTML="<p>I am a political scientist with a deep interest in climate change, public policy, and social vulnerability in South Asia.</p>";
  document.getElementById("ambitionText").textContent="To contribute to evidence-based climate policy in the Global South.";
}

const posSnap = await getDocs(query(collection(db,"positions"),orderBy("order")));
document.getElementById("positionsList").innerHTML = timelineHTML(posSnap.docs.map(d=>d.data()));

const expSnap = await getDocs(query(collection(db,"experience"),orderBy("order")));
document.getElementById("experienceList").innerHTML = timelineHTML(expSnap.docs.map(d=>d.data()));

const eduSnap = await getDocs(query(collection(db,"education"),orderBy("order")));
document.getElementById("educationList").innerHTML = timelineHTML(eduSnap.docs.map(d=>d.data()));
</script>
</body></html>
