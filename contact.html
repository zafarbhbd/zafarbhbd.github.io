<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .contact-grid { display: grid; grid-template-columns: 340px 1fr; gap: 64px; align-items: start; }
    @media(max-width:900px){ .contact-grid { grid-template-columns: 1fr; gap: 40px; } }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">Abu Zafar</a>
    <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="publications.html">Publications</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1>Contact</h1>
    <p>Get in touch for collaborations, questions, or just to say hello.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="contact-grid">
      <div id="contactInfo"><div class="spinner"></div></div>
      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" required/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" placeholder="Research collaboration, question…"/>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Your message…" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p class="form-note" id="formNote"></p>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <p>&copy; <span id="year"></span> Abu Zafar. All rights reserved.</p>
    <p>Hosted on Firebase &amp; GitHub Pages</p>
  </div>
</footer>

<script type="module">
  import { db }          from "./js/firebase-config.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import "./js/shared.js";

  // Load contact details
  const snap = await getDoc(doc(db, "site", "contact"));
  const info = document.getElementById("contactInfo");

  if (snap.exists()) {
    const d = snap.data();
    info.innerHTML = `
      <div class="contact-item">
        <span class="contact-icon">✉️</span>
        <div><strong>Email</strong>
          <a href="mailto:${d.email || ""}">${d.email || "—"}</a></div>
      </div>
      <div class="contact-item">
        <span class="contact-icon">🏛️</span>
        <div><strong>Office</strong>
          <span>${d.office || "—"}</span></div>
      </div>
      <div class="contact-item">
        <span class="contact-icon">🔗</span>
        <div><strong>Links</strong>
          <div class="contact-links">
            ${d.github      ? `<a href="${d.github}"      target="_blank">GitHub</a>`      : ""}
            ${d.scholar     ? `<a href="${d.scholar}"     target="_blank">Google Scholar</a>` : ""}
            ${d.researchgate? `<a href="${d.researchgate}"target="_blank">ResearchGate</a>` : ""}
            ${d.orcid       ? `<a href="${d.orcid}"       target="_blank">ORCID</a>`       : ""}
            ${d.linkedin    ? `<a href="${d.linkedin}"    target="_blank">LinkedIn</a>`    : ""}
          </div>
        </div>
      </div>`;
  } else {
    info.innerHTML = `<p style="color:var(--clr-muted)">Contact details coming soon.</p>`;
  }

  // Contact form via Formspree
  // Replace YOUR_FORMSPREE_ENDPOINT with your actual Formspree URL
  const FORMSPREE = "YOUR_FORMSPREE_ENDPOINT";
  const form = document.getElementById("contactForm");
  const note = document.getElementById("formNote");

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (FORMSPREE === "YOUR_FORMSPREE_ENDPOINT") {
      note.textContent = "✅ Demo mode — set up Formspree to send real emails.";
      note.style.color = "var(--clr-accent2)";
      form.reset(); return;
    }
    try {
      const res = await fetch(FORMSPREE, { method:"POST", body: new FormData(form), headers:{ Accept:"application/json" } });
      if (res.ok) { note.textContent = "✅ Message sent!"; note.style.color = "var(--clr-accent2)"; form.reset(); }
      else        { note.textContent = "⚠️ Something went wrong. Please email me directly."; note.style.color = "#c0392b"; }
    } catch { note.textContent = "⚠️ Network error."; note.style.color = "#c0392b"; }
  });
</script>
</body>
</html>
