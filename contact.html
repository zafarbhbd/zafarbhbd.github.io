<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Contact | Abu Zafar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="navbar"></nav>
<div class="page-header"><div class="container"><h1>Contact</h1><p>Get in touch for collaborations, questions, or just to say hello.</p></div></div>
<section class="section">
  <div class="container">
    <div class="contact-grid">
      <div id="contactInfo" data-fade><div class="spinner"></div></div>
      <div data-fade>
        <h3 style="font-family:var(--font-head);font-size:1.3rem;margin-bottom:20px">Send a Message</h3>
        <form class="contact-form" id="contactForm">
          <div class="form-group"><label>Name</label><input type="text" id="cName" placeholder="Your name" required/></div>
          <div class="form-group"><label>Email</label><input type="email" id="cEmail" placeholder="your@email.com" required/></div>
          <div class="form-group"><label>Subject</label><input type="text" id="cSubject" placeholder="Research collaboration, question…"/></div>
          <div class="form-group"><label>Message</label><textarea id="cMessage" rows="5" placeholder="Your message…" required></textarea></div>
          <button type="submit" class="btn btn-primary">Send Message ✉️</button>
          <p class="form-note" id="formNote"></p>
        </form>
      </div>
    </div>
  </div>
</section>
<footer class="footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Abu Zafar.</p></div></footer>
<script type="module">
import { insertNav } from "./js/nav.js";
import { db } from "./js/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import "./js/shared.js";
insertNav("contact");

const snap=await getDoc(doc(db,"site","contact"));
const info=document.getElementById("contactInfo");
if(snap.exists()){
  const d=snap.data();
  info.innerHTML=`
    <h3 style="font-family:var(--font-head);font-size:1.3rem;margin-bottom:20px">Get In Touch</h3>
    <div class="contact-item"><span class="contact-icon">✉️</span><div><strong>Email</strong><a href="mailto:${d.email||""}">${d.email||"—"}</a></div></div>
    <div class="contact-item"><span class="contact-icon">🏛️</span><div><strong>Office</strong><span>${d.office||"—"}</span></div></div>
    <div class="contact-item"><span class="contact-icon">🔗</span><div><strong>Links</strong><div class="contact-links">
      ${d.github?`<a href="${d.github}" target="_blank">GitHub</a>`:""}
      ${d.scholar?`<a href="${d.scholar}" target="_blank">Google Scholar</a>`:""}
      ${d.researchgate?`<a href="${d.researchgate}" target="_blank">ResearchGate</a>`:""}
      ${d.orcid?`<a href="${d.orcid}" target="_blank">ORCID</a>`:""}
      ${d.linkedin?`<a href="${d.linkedin}" target="_blank">LinkedIn</a>`:""}
    </div></div></div>`;
} else {
  info.innerHTML=`<p style="color:var(--clr-muted)">Contact details coming soon.</p>`;
}

// Contact form — replace FORMSPREE_URL with your Formspree endpoint
// Get one free at https://formspree.io
const FORMSPREE="YOUR_FORMSPREE_ENDPOINT";
document.getElementById("contactForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const note=document.getElementById("formNote");
  const btn=e.target.querySelector("button[type=submit]");
  btn.disabled=true; btn.textContent="Sending…";
  if(FORMSPREE==="YOUR_FORMSPREE_ENDPOINT"){
    note.textContent="✅ Demo mode — set up Formspree to send real emails.";
    note.style.color="var(--clr-accent2)";
    e.target.reset(); btn.disabled=false; btn.textContent="Send Message ✉️"; return;
  }
  try{
    const res=await fetch(FORMSPREE,{method:"POST",body:new FormData(e.target),headers:{Accept:"application/json"}});
    if(res.ok){note.textContent="✅ Message sent! I will get back to you soon.";note.style.color="var(--clr-accent2)";e.target.reset();}
    else{note.textContent="⚠️ Something went wrong. Please email me directly.";note.style.color="#c62828";}
  }catch{note.textContent="⚠️ Network error.";note.style.color="#c62828";}
  btn.disabled=false; btn.textContent="Send Message ✉️";
});
</script>
</body></html>
